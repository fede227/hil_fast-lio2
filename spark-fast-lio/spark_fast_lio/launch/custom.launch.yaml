launch:

  - arg: {name: start_rviz, default: 'true', description: automatically start rviz}
  - arg: {name: scene_id,   default: 'test', description: 'Scene name for input message topics'}
  - arg: {name: robot_name, default: 'x500', description: 'The actual robot used when acquiring data'}

  # Frames
  - arg: {name: map_frame, default: 'odom'}
  - arg: {name: base_frame, default: 'base_link'}

  - arg: {name: rviz_path, default: $(find-pkg-share spark_fast_lio)/rviz/velodyne_mit.rviz}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/velodyne_mit.yaml}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - {from: 'lidar', to: 'lidar/points'}
        - {from: 'imu', to: 'imu'}

      param:
        - name: "common.lidar_frame"
          value: "x500_lidar_3d_full_0/hesai_lidar/lidar"
        - name: "common.imu_frame"
          value: "base_link"
        - name: "common.map_frame"
          value: "$(var map_frame)"
        - name: "common.base_frame"
          value: "$(var base_frame)"
        - name: "common.visualization_frame"
          value: "base"
        - name: "use_sim_time"
          value: true
        - name: "publish.dense_publish_en"
          value: true

        - name: "gravity_alignment.enable_gravity_alignment"
          value: false
        - from: $(var config_path)


  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz
      output: screen
      args: -d $(var rviz_path)
      param:
        - name: "use_sim_time"
          value: true



  
